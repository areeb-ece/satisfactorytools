<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Every calculation runs in this tab. connect-src 'none' means the page can't send
     anything over the network, even by mistake. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Satisfactory Tools</title>
<meta name="description" content="Calculators and planners for Satisfactory: a production planner for whole factories, recipe browser, alternate recipe comparer, overclocking, miners, power, belt splitting, trains and drones, the AWESOME Sink and milestones. Runs entirely in your browser.">
<meta name="author" content="areeb">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/mononoki-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/mononoki-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<!-- Shared with areeb-ece.github.io, PrereqFlow and OTU Calendar (areeb-ece.github.io/design/):
     the master palette and its themes, the settings panel and the night sky, and the
     visitor's saved settings (one localStorage entry for every site). The colours in
     css/style.css and js/theme.js's light/dark switch are a fallback for offline use. -->
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/ui.css">
<script src="/design/theme.js"></script>
<script src="js/theme.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <div class="wordmark"><b><a href="#/">SATISFACTORY<span>/</span>TOOLS</a></b><a href="https://areeb-ece.github.io/" rel="noopener noreferrer">by areeb</a></div>
      <div class="sheetinfo" id="sheetInfo">GAME DATA 1.0 · RECIPES UNCHANGED THROUGH 1.2</div>
    </div>
    <div class="tools">
      <span class="lock" title="This page cannot make network requests. Your plans stay in this browser."><i></i>offline · nothing uploaded</span>
      <span class="sep"></span>
      <span class="design-slot" data-design-settings></span>
      <button class="btn theme" id="btnTheme" type="button" title="Switch between the dark and light sheet" hidden>Light</button>
    </div>
  </header>

  <div class="main">
    <nav class="nav" id="nav" aria-label="Tools"></nav>
    <main class="stage" id="stage" data-sky>
      <div class="scroll" id="scroll"><div class="view" id="view"></div></div>
    </main>
  </div>
</div>
<noscript><p class="note warn">These tools are calculators that run in your browser, so they need JavaScript.</p></noscript>
<script src="/design/ui.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
