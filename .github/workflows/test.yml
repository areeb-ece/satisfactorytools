name: test
# Unit tests, then the browser check and the feature check, each twice: once offline (the
# page's own copy of the shared design and its light/dark switch) and once with the
# shared theme, settings panel and sky as the live portfolio serves them.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # The shared files exactly as the live site serves them to this page. fonts.css (the
      # portfolio's text face) points at /fonts/, so its two font files come along; until the
      # portfolio publishes it, an empty stand-in keeps the page on the system sans.
      - run: |
          mkdir -p "$RUNNER_TEMP/site/design" "$RUNNER_TEMP/site/fonts"
          for f in tokens.css ui.css theme.js ui.js; do
            curl -fsSL "https://areeb-ece.github.io/design/$f" -o "$RUNNER_TEMP/site/design/$f"
          done
          curl -fsSL "https://areeb-ece.github.io/design/fonts.css" -o "$RUNNER_TEMP/site/design/fonts.css" || : > "$RUNNER_TEMP/site/design/fonts.css"
          for f in LibreFranklin-Var.woff2 LibreFranklin-Italic-Var.woff2; do
            curl -fsSL "https://areeb-ece.github.io/fonts/$f" -o "$RUNNER_TEMP/site/fonts/$f" || true
          done
      - run: npm run test:browser
        env:
          DESIGN_DIR: ${{ runner.temp }}/site/design
      # Every feature, driven the way a player would, at desktop and phone width.
      - run: npm run test:features
      - run: npm run test:features
        env:
          DESIGN_DIR: ${{ runner.temp }}/site/design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
