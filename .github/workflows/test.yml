name: test
# Unit tests, then the browser check twice: once offline (the page's own light/dark
# fallback) and once with the shared theme, settings panel and sky from the portfolio.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: areeb-ece/areeb-ece.github.io
          path: portfolio
          sparse-checkout: public/design
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          DESIGN_DIR: portfolio/public/design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
